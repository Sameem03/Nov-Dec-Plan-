<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sameem · 30-Day Plan</title>
<meta name="description" content="30-day plan for Taankay, Fashion Silhouettes, Bündle.co and LinkedIn. 4 Nov to 6 Dec 2026.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='16' fill='%23c4643d'/><text x='32' y='43' font-size='30' text-anchor='middle' fill='white' font-family='Georgia'>30</text></svg>">
<style>
:root{
  --bg:#f6f1e9; --surface:#fffdf9; --surface2:#f1ebe1; --ink:#1f1b16; --muted:#71685c; --faint:#a39a8d; --line:#e6ddcf;
  --tk:#c25e36; --fs:#3b5b85; --bd:#5b7d55; --li:#2b6cb0; --gold:#b98a2e;
  --shadow:0 1px 2px rgba(60,40,20,.05),0 8px 24px -12px rgba(60,40,20,.18);
  --r:18px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#14120f; --surface:#1d1a16; --surface2:#26221d; --ink:#f2ece2; --muted:#a99f91; --faint:#776e62; --line:#332d26;
    --tk:#e58a63; --fs:#86a6d4; --bd:#94bb8c; --li:#6fa7e6; --gold:#e0b659;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -14px rgba(0,0,0,.6); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#14120f; --surface:#1d1a16; --surface2:#26221d; --ink:#f2ece2; --muted:#a99f91; --faint:#776e62; --line:#332d26;
  --tk:#e58a63; --fs:#86a6d4; --bd:#94bb8c; --li:#6fa7e6; --gold:#e0b659;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -14px rgba(0,0,0,.6); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:600;letter-spacing:-.01em;margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 0 6px}
.logo{display:flex;align-items:center;gap:10px;font-weight:600}
.logo b{display:grid;place-items:center;width:34px;height:34px;border-radius:11px;background:var(--ink);color:var(--bg);font-family:Fraunces,serif;font-size:15px}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;height:38px;min-width:38px;padding:0 12px;display:inline-flex;align-items:center;gap:6px;justify-content:center;transition:.15s}
.icon-btn:hover{border-color:var(--faint)}

/* hero */
.hero{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;margin:14px 0 18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.hello{padding:26px 26px 22px;position:relative;overflow:hidden}
.hello h1{font-size:clamp(28px,4.4vw,42px);line-height:1.08}
.hello h1 em{font-style:italic;color:var(--tk)}
.hello p{margin:10px 0 0;max-width:52ch}
.hello .blob{position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle at 30% 30%,color-mix(in srgb,var(--tk) 26%,transparent),transparent 70%);pointer-events:none}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.stat{background:var(--surface2);border-radius:14px;padding:10px 14px;min-width:110px}
.stat .n{font-family:Fraunces,serif;font-size:24px;font-weight:600;line-height:1.1}
.stat .l{font-size:12px;color:var(--muted)}
.prog{padding:22px;display:flex;gap:20px;align-items:center}
.ring{position:relative;width:118px;height:118px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .v b{font-family:Fraunces,serif;font-size:28px;display:block;line-height:1}
.ring .v span{font-size:11px;color:var(--muted)}
.bars{flex:1;display:grid;gap:11px;min-width:0}
.bar-row{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:13px}
.bar-row .track{grid-column:1/-1}
.track{height:7px;border-radius:9px;background:var(--surface2);overflow:hidden}
.track i{display:block;height:100%;border-radius:9px;transition:width .4s ease}

/* nav */
.nav{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:10px 0;border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.tabs{display:flex;gap:4px;background:var(--surface2);padding:4px;border-radius:14px;overflow-x:auto;max-width:100%;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:transparent;padding:8px 14px;border-radius:10px;font-weight:500;color:var(--muted);white-space:nowrap;transition:.15s}
.tab.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px 5px 9px;font-size:13px;display:inline-flex;align-items:center;gap:7px;transition:.15s}
.chip .dot{width:9px;height:9px;border-radius:50%}
.chip.off{opacity:.45}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;flex:none}
.c-tk{--c:var(--tk)} .c-fs{--c:var(--fs)} .c-bd{--c:var(--bd)} .c-li{--c:var(--li)}
.bgc{background:var(--c)}

main{padding:20px 0 40px}
.view{animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.sec-h{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:0 0 14px;flex-wrap:wrap}
.sec-h h2{font-size:26px}

/* today */
.today{display:grid;grid-template-columns:1.55fr 1fr;gap:16px;align-items:start}
.daybar{display:flex;align-items:center;gap:10px;padding:16px 18px;flex-wrap:wrap}
.daybar h2{font-size:24px;flex:1;min-width:180px}
.daybar .sub{font-family:Inter,sans-serif;font-size:13px;color:var(--muted);font-weight:500;display:block;margin-top:2px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;background:color-mix(in srgb,var(--c,var(--ink)) 14%,transparent);color:var(--c,var(--ink))}
.group{padding:4px 18px 16px}
.group+.group{border-top:1px solid var(--line);padding-top:14px}
.g-h{display:flex;align-items:center;gap:8px;margin:6px 0 8px;font-weight:600;font-size:14px}
.g-h .cnt{margin-left:auto;font-weight:500;color:var(--muted);font-size:12px}
.task{display:flex;gap:12px;align-items:flex-start;padding:10px 10px;border-radius:12px;cursor:pointer;transition:background .15s;position:relative}
.task:hover{background:var(--surface2)}
.task input{position:absolute;opacity:0;pointer-events:none}
.tick{flex:none;width:22px;height:22px;border-radius:7px;border:2px solid color-mix(in srgb,var(--c,var(--ink)) 55%,var(--line));display:grid;place-items:center;margin-top:1px;transition:.15s}
.tick::after{content:"";width:10px;height:6px;border-left:2.5px solid #fff;border-bottom:2.5px solid #fff;transform:rotate(-45deg) translate(1px,-1px) scale(0);transition:transform .18s}
.task input:checked+.tick{background:var(--c,var(--ink));border-color:var(--c,var(--ink))}
.task input:checked+.tick::after{transform:rotate(-45deg) translate(1px,-1px) scale(1)}
.task input:focus-visible+.tick{outline:2px solid var(--c);outline-offset:2px}
.t-body{min-width:0;flex:1}
.t-txt{display:block}
.t-meta{display:flex;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:2px}
.task.done .t-txt{color:var(--faint);text-decoration:line-through;text-decoration-color:var(--faint)}
.tag{font-size:11px;border:1px solid var(--line);border-radius:6px;padding:0 6px}
.linkbtn{border:0;background:none;padding:0;color:var(--c,var(--li));font-weight:600;font-size:12px;text-decoration:underline;text-underline-offset:2px}
details.cap{margin:-2px 10px 8px 44px;border:1px solid var(--line);border-radius:12px;background:var(--surface2)}
details.cap summary{cursor:pointer;padding:8px 12px;font-size:13px;font-weight:600;color:var(--li);list-style:none}
details.cap summary::-webkit-details-marker{display:none}
.capbox{padding:0 12px 12px}
.capbox pre{white-space:pre-wrap;font:14px/1.55 Inter,sans-serif;margin:0 0 8px}
mark{background:color-mix(in srgb,var(--gold) 26%,transparent);color:inherit;border-radius:4px;padding:0 3px}
.empty{padding:34px 18px;text-align:center;color:var(--muted)}
.side{display:grid;gap:16px}
.side .card{padding:16px 18px}
.side h3{font-size:18px;margin-bottom:4px}
.wk-badge{display:flex;gap:8px;align-items:center;margin-top:8px;font-size:13px}
.mini-list .task{padding:7px 6px}
.mini-list .t-txt{font-size:14px}
textarea{width:100%;min-height:96px;border:1px solid var(--line);background:var(--surface2);border-radius:12px;padding:10px 12px;resize:vertical;outline:none}
textarea:focus,input[type=number]:focus,input[type=text]:focus{border-color:var(--faint)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:7px 12px;font-weight:500;font-size:13px;display:inline-flex;gap:6px;align-items:center}
.btn.dark{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn:hover{border-color:var(--faint)}

/* calendar */
.cal-head,.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.cal-head div{font-size:12px;font-weight:600;color:var(--muted);padding:0 4px;text-transform:uppercase;letter-spacing:.06em}
.cal{margin-top:8px}
.cell{background:var(--surface);border:1px solid var(--line);border-radius:14px;min-height:132px;padding:9px;text-align:left;display:flex;flex-direction:column;gap:5px;transition:.15s;position:relative;min-width:0}
.cell:hover{border-color:var(--faint);transform:translateY(-1px)}
.cell.out{opacity:.35;pointer-events:none;background:transparent;box-shadow:none}
.cell.is-today{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.cell .num{display:flex;align-items:center;justify-content:space-between;font-weight:600;font-size:13px}
.cell .num .wd{display:none}
.ms{font-size:10.5px;font-weight:700;color:var(--gold);background:color-mix(in srgb,var(--gold) 15%,transparent);border-radius:6px;padding:1px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.ln{display:flex;gap:6px;align-items:center;font-size:12px;min-width:0}
.ln span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ln.done span:last-child{text-decoration:line-through;color:var(--faint)}
.ln .dot{width:7px;height:7px}
.more{font-size:11.5px;color:var(--muted)}
.cell .track{margin-top:auto;height:4px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}

/* goals */
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.goal{padding:18px;border-top:4px solid var(--c)}
.goal h3{font-size:20px}
.goal .stmt{margin:6px 0 10px;color:var(--muted);font-size:14px}
.out-row{margin:10px 0}
.out-row .bar-row{font-size:13.5px}
.sched{display:grid;gap:8px;margin-top:10px}
.slot{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;padding:9px 12px;border-radius:12px;background:var(--surface2);font-size:14px}
.slot b{font-family:Fraunces,serif;font-size:15px}
.rules{margin:12px 0 0;padding-left:18px;color:var(--muted);font-size:14px}
.rules li{margin:5px 0}
.wk{margin-top:16px}
.wk>summary{list-style:none;cursor:pointer;padding:16px 18px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.wk>summary::-webkit-details-marker{display:none}
.wk>summary h3{font-size:20px;flex:1;min-width:200px}
.wk>summary .chev{transition:transform .2s;color:var(--muted)}
.wk[open]>summary .chev{transform:rotate(90deg)}
.wk-body{padding:0 18px 18px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.col{background:var(--surface2);border-radius:14px;padding:12px}
.col h4{margin:2px 4px 6px;font-size:14px;display:flex;align-items:center;gap:7px}
.col .task{padding:7px 6px}
.col .task:hover{background:var(--surface)}
.col .t-txt{font-size:14px}
.note{font-size:13px;color:var(--muted);margin:8px 6px 0}
.note b{color:var(--ink);font-weight:600}

/* model strip */
.flow{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-top:12px}
.flow div{background:var(--surface2);border-radius:14px;padding:12px;font-size:13.5px}
.flow b{display:block;font-family:Fraunces,serif;font-size:20px;color:var(--c);line-height:1.1;margin-bottom:4px}
.ladder{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:12px}
.ladder div{border:1px solid var(--line);border-radius:14px;padding:12px;font-size:13px;color:var(--muted)}
.ladder b{display:block;font-family:Fraunces,serif;font-size:22px;color:var(--ink)}

/* tracker */
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:10px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
td.m{white-space:normal;min-width:180px}
input[type=number],input[type=text].in{width:70px;border:1px solid var(--line);background:var(--surface2);border-radius:9px;padding:6px 8px;outline:none}
input[type=text].in{width:100px}
.st{font-size:12px;font-weight:600;border-radius:999px;padding:3px 9px;display:inline-block}
.st.ok{background:color-mix(in srgb,var(--bd) 18%,transparent);color:var(--bd)}
.st.mid{background:color-mix(in srgb,var(--gold) 20%,transparent);color:var(--gold)}
.st.bad{background:color-mix(in srgb,var(--tk) 18%,transparent);color:var(--tk)}
.st.na{background:var(--surface2);color:var(--muted)}
.pad{padding:18px}

/* linkedin */
.posts{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.post{padding:16px 18px;display:flex;flex-direction:column;gap:10px;border-left:4px solid var(--c)}
.post.posted{opacity:.7}
.post .ph{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.post .ph .date{margin-left:auto;font-size:13px;color:var(--muted);font-weight:500}
.post h3{font-size:18px;line-height:1.25}
.post pre{white-space:pre-wrap;font:14px/1.55 Inter,sans-serif;margin:0;background:var(--surface2);border-radius:12px;padding:12px;max-height:210px;overflow:auto}
.post .hash{font-size:13px;color:var(--li)}
.post .foot{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:auto}
.post .task{padding:4px 0}
.post .task:hover{background:none}
.kv{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kv div{background:var(--surface2);border-radius:14px;padding:12px 14px}
.kv b{display:block;font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px}
.kv span{font-size:14px}

footer{border-top:1px solid var(--line);padding:22px 0 40px;color:var(--muted);font-size:13px}
footer .wrap{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,30px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:50}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:960px){
  .hero,.today{grid-template-columns:1fr}
  .grid3,.wk-body{grid-template-columns:1fr}
  .kv{grid-template-columns:repeat(2,minmax(0,1fr))}
  .flow{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ladder{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:720px){
  .cal-head{display:none}
  .cal{grid-template-columns:1fr}
  .cell{min-height:0}
  .cell.out{display:none}
  .cell .num .wd{display:inline;color:var(--muted);font-weight:500;margin-left:6px}
  .grid2{grid-template-columns:1fr}
  .prog{flex-direction:column;align-items:stretch}
  .ring{margin:0 auto}
  .posts{grid-template-columns:1fr}
  .hello{padding:22px 18px}
  details.cap{margin-left:10px}
}
details.steps{margin:-4px 10px 8px 44px}
details.steps summary{cursor:pointer;font-size:12.5px;font-weight:600;color:var(--c,var(--muted));list-style:none;padding:2px 0}
details.steps summary::-webkit-details-marker{display:none}
details.steps summary::before{content:"› ";display:inline-block;transition:transform .15s}
details.steps[open] summary::before{transform:rotate(90deg)}
details.steps ol{margin:4px 0 6px;padding-left:20px;font-size:13.5px;color:var(--muted)}
details.steps li{margin:3px 0}
.post details.steps{margin:0}
.phases{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.phases>div{background:var(--surface2);border-radius:14px;padding:12px;font-size:13.5px}
.phases b{display:block;font-family:Fraunces,serif;font-size:19px;color:var(--c);line-height:1.15}
@media (max-width:720px){details.steps{margin-left:10px}}
@media (max-width:420px){.kv,.flow{grid-template-columns:1fr}}
@media print{.nav,footer,.top .icon-btn{display:none}}
</style>
</head>
<body>

<div class="wrap">
  <div class="top">
    <div class="logo"><b>30</b><span>Sameem's 30-Day Plan</span></div>
    <div style="display:flex;gap:8px">
      <button class="icon-btn" id="themeBtn" aria-label="Toggle theme" title="Toggle theme">◑ Theme</button>
    </div>
  </div>
  <section class="hero" id="hero"></section>
</div>

<nav class="nav">
  <div class="wrap">
    <div class="tabs" role="tablist" id="tabs">
      <button class="tab" data-tab="today">Today</button>
      <button class="tab" data-tab="calendar">Calendar</button>
      <button class="tab" data-tab="goals">Goals & Weeks</button>
      <button class="tab" data-tab="tracker">Tracker</button>
      <button class="tab" data-tab="instagram">Instagram</button>
      <button class="tab" data-tab="linkedin">LinkedIn</button>
    </div>
    <div class="chips" id="chips"></div>
  </div>
</nav>

<main class="wrap"><div id="view"></div></main>

<footer>
  <div class="wrap">
    <span>Progress saves in this browser. Back it up now and then.</span>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn" id="exportBtn">Export progress</button>
      <label class="btn" style="cursor:pointer">Import<input type="file" id="importIn" accept="application/json" hidden></label>
      <button class="btn" id="resetBtn">Reset</button>
    </div>
  </div>
</footer>
<div class="toast" id="toast"></div>

<script>
/* ---------- helpers ---------- */
const pad=n=>String(n).padStart(2,'0');
const key=dt=>`${dt.getFullYear()}-${pad(dt.getMonth()+1)}-${pad(dt.getDate())}`;
const parse=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return key(d)};
const diff=(a,b)=>Math.round((parse(a)-parse(b))/864e5);
const fmt=(s,o)=>parse(s).toLocaleDateString('en-GB',o);
const dow=s=>parse(s).getDay();
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mk=s=>esc(s).replace(/\[([^\]]+)\]/g,'<mark>[$1]</mark>');
const START='2026-11-04', END='2026-12-06', REVIEW='2026-12-04';

const BR={
  tk:{n:'Taankay',t:'B2C E-stitching'},
  fs:{n:'Fashion Silhouettes',t:'B2B manufacturing'},
  bd:{n:'Bündle.co',t:'Tech packs on Etsy'},
  li:{n:'LinkedIn',t:'Personal brand'}
};

function taskHTML(t,o={}){
  const b=t.b; const d=isDone(t.id);

    h+=`<details class="cap"><summary>View caption · ${esc(p.f)}</summary><div class="capbox"><pre>${mk(p.c)}</pre><div class="small" style="color:var(--li)">${esc(p.h)}</div><div class="small muted" style="margin:6px 0 10px">Visual: ${esc(p.v)}</div><button class="btn dark" data-copy="${t.post}">Copy caption</button></div></details>`;

  }
  const st=STEPS[t.sk]||(t.kind==='igpost'?igSteps(t.cb,IGC[t.cb][t.ci]):null);
  if(st&&!o.noSteps) h+=stepsHTML(st,t.id,b);

function weeksFilled(){let n=0;for(let w=1;w<=4;w++){if(METRICS.some(m=>(S.tr[m.id]||{})[w]!==undefined&&(S.tr[m.id]||{})[w]!==''))n=w}return n}
function mval(m){const v=S.tr[m.id]||{};const nums=[1,2,3,4].map(w=>v[w]).filter(x=>x!==undefined&&x!=='').map(Number);if(!nums.length)return null;return m.agg==='sum'?nums.reduce((a,b)=>a+b,0):nums[nums.length-1]}
function mstatus(m){
  const val=mval(m); if(val===null) return '<span class="st na">No data yet</span>';
  if(m.agg==='pct') return val>=100?'<span class="st ok">On track</span>':'<span class="st mid">Watch it</span>';
  const wf=weeksFilled()||1; const exp=m.t*wf/4; const r=val/exp;
  if(val>=m.t) return '<span class="st ok">Target hit</span>';
  if(r>=1) return '<span class="st ok">On track</span>';
  if(r>=.5) return '<span class="st mid">A bit behind</span>';
  return '<span class="st bad">50% behind · next Sat block</span>';
}

function render(){

  const open=[...document.querySelectorAll('details[open]')].map(dk);
  document.getElementById('view').innerHTML=v();
  document.querySelectorAll('details').forEach(x=>{if(open.includes(dk(x)))x.open=true});
}
function go(tab){ui.tab=tab;setPref('s30-tab',tab);render();window.scrollTo({top:document.querySelector('.nav').offsetTop,behavior:'smooth'})}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),1800)}
function copy(txt){
  const ok=()=>toast('Caption copied');
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(txt).then(ok).catch(()=>fallback(txt,ok))}else fallback(txt,ok);
}
function fallback(txt,cb){const a=document.createElement('textarea');a.value=txt;document.body.appendChild(a);a.select();try{document.execCommand('copy');cb()}catch(e){toast('Copy failed, select the text manually')}a.remove()}

document.addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset.id){S.done[el.dataset.id]=el.checked;if(!el.checked)delete S.done[el.dataset.id];save();render();if(el.checked)toast('Nice. One less thing.');}
  if(el.dataset.tr){render()}
});
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.dataset.note!==undefined){S.notes[el.dataset.note]=el.value;save()}
  if(el.dataset.tr){S.tr[el.dataset.tr]=S.tr[el.dataset.tr]||{};S.tr[el.dataset.tr][el.dataset.w]=el.value;save()}
  if(el.dataset.lim){S.lim[el.dataset.lim]=el.value;save()}
});
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-tab],[data-f],[data-nav],[data-day],[data-copy],[data-igcopy],[data-ig],[data-go]');
  if(!t) return;
  if(t.dataset.igcopy){e.preventDefault();const[b,i]=t.dataset.igcopy.split(':');const p=IGC[b][+i],c=IGB[b];copy(p.c+'\n\n'+c.trust+'\n\n'+c.tags);return}
  if(t.dataset.ig){ui.ig=t.dataset.ig;setPref('s30-ig',ui.ig);render();return}
  if(t.dataset.copy!==undefined){e.preventDefault();const p=POSTS[+t.dataset.copy];copy(p.c+'\n\n'+p.h);return}
  if(t.dataset.go){e.preventDefault();go(t.dataset.go);return}
  if(t.dataset.tab){go(t.dataset.tab);return}
  if(t.dataset.f){const b=t.dataset.f;if(ui.f.has(b)&&ui.f.size===1){ORDER.forEach(x=>ui.f.add(x))}else if(ui.f.has(b))ui.f.delete(b);else ui.f.add(b);render();return}
  if(t.dataset.nav){ui.sel=t.dataset.nav==='today'?clamp(realToday):clamp(addDays(ui.sel,+t.dataset.nav));render();return}
  if(t.dataset.day){ui.sel=t.dataset.day;go('today');return}
});
document.addEventListener('keydown',e=>{
  if(ui.tab!=='today'||/INPUT|TEXTAREA/.test(document.activeElement.tagName))return;
  if(e.key==='ArrowLeft'){ui.sel=clamp(addDays(ui.sel,-1));render()}
  if(e.key==='ArrowRight'){ui.sel=clamp(addDays(ui.sel,1));render()}
});
document.getElementById('themeBtn').onclick=()=>{
  const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;
  r.dataset.theme=dark?'light':'dark';setPref('s30-theme',r.dataset.theme);
};
document.getElementById('exportBtn').onclick=()=>{
  const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`30-day-progress-${realToday}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Progress exported');
};
document.getElementById('importIn').onchange=e=>{
  const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);Object.assign(S,blank(),d);save();render();toast('Progress imported')}catch(err){toast('That file did not look right')}};r.readAsText(f);
};
document.getElementById('resetBtn').onclick=()=>{if(confirm('Clear all ticks, notes and tracker numbers in this browser?')){Object.assign(S,blank());save();render();toast('Reset done')}};
render();
